name: yetpay
description: "YETMPAY – biometric merchant payment terminal."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.0
  material_symbols_icons: ^4.2787.0
  qr_flutter: ^4.1.0

  # State & navigation
  provider: ^6.1.0
  go_router: ^14.0.0

  # Storage & hardware
  flutter_secure_storage: ^9.0.0
  camera: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/launcher_icon.png

  # Fonts declared here but files are stubs until real .ttf files are dropped in.
